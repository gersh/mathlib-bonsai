name: Bonsai reporter

on:
  workflow_run:
    workflows: [Mathlib Bonsai]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download verifier result
        continue-on-error: true
        id: download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bonsai-result
          path: result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish or update PR report
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          number=$(tr -dc '0-9' < result/pr-number.txt)
          gh pr comment "$number" --repo "$REPOSITORY" --body-file result/report.md \
            --edit-last --create-if-none

      - name: Maintain eligibility label
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          number=$(tr -dc '0-9' < result/pr-number.txt)
          accepted=$(python3 -c 'import json; print(str(json.load(open("result/result.json")).get("accepted", False)).lower())')
          if [[ "$accepted" == true ]]; then
            label='bonsai:eligible'
            color='1f883d'
            opposite='bonsai:invalid'
          else
            label='bonsai:invalid'
            color='cf222e'
            opposite='bonsai:eligible'
          fi
          gh api --method POST "repos/$REPOSITORY/labels" -f name="$label" -f color="$color" \
            >/dev/null 2>&1 || true
          gh pr edit "$number" --repo "$REPOSITORY" --remove-label "$opposite" \
            >/dev/null 2>&1 || true
          gh pr edit "$number" --repo "$REPOSITORY" --add-label "$label"
