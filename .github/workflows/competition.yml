name: Mathlib Bonsai

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: competition-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          path: baseline

      - name: Check out untrusted candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
          path: candidate

      - name: Fetch base for policy comparison
        working-directory: candidate
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 "https://github.com/${BASE_REPOSITORY}.git" "$BASE_SHA"

      - name: Enforce entry boundary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 baseline/bonsai/check_policy.py candidate "$BASE_SHA" "$HEAD_SHA"

      - name: Configure Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: baseline
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          reinstall-transient-toolchain: true

      - name: Restore upstream Mathlib cache
        working-directory: baseline
        run: lake exe cache --repo=leanprover-community/mathlib4 get

      - name: Measure trusted baseline
        run: |
          python3 baseline/bonsai/scorer.py baseline --output baseline-score.json >/dev/null
          baseline/bonsai/export_surface.sh baseline baseline/bonsai/surface.lean baseline-surface.jsonl

      - name: Reuse cache in candidate
        run: cp -a baseline/.lake candidate/.lake

      - name: Build candidate with warnings as errors
        working-directory: candidate
        env:
          CI: "true"
        run: lake build --wfail Mathlib

      - name: Measure candidate
        run: |
          python3 baseline/bonsai/scorer.py candidate --output candidate-score.json >/dev/null
          baseline/bonsai/export_surface.sh candidate baseline/bonsai/surface.lean candidate-surface.jsonl

      - name: Compare score and public theorem surface
        id: comparison
        continue-on-error: true
        run: |
          status=0
          python3 baseline/bonsai/compare.py \
            baseline-score.json candidate-score.json \
            baseline-surface.jsonl candidate-surface.jsonl \
            --output result.json --markdown report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Explain an early failure
        if: always() && hashFiles('report.md') == ''
        run: |
          cat > report.md <<'EOF'
          ## Mathlib Bonsai result

          ❌ Verification stopped before scoring. Open the failed **Competition / verify** job for
          the policy or build error. A submission must build with warnings as errors before its
          theorem surface and score can be compared.
          EOF
          printf '%s\n' '{"schema":1,"accepted":false,"error":"verification stopped before comparison"}' > result.json
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record PR number
        if: always()
        run: printf '%s\n' '${{ github.event.pull_request.number }}' > pr-number.txt

      - name: Upload machine-readable result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bonsai-result
          path: |
            result.json
            report.md
            pr-number.txt
          if-no-files-found: error
          retention-days: 30

      - name: Enforce result
        if: steps.comparison.outcome != 'success'
        run: exit 1
