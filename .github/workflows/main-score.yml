name: Bonsai reigning score

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional merged PR number to replay for the leaderboard
        required: false
        type: string

concurrency:
  group: bonsai-reigning-score
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.LEADERBOARD_DEPLOY_KEY }}
      - name: Calculate reigning score
        run: |
          python3 -m bonsai.scorer . --output reigning-score.json >/dev/null
          total=$(python3 -c "import json; print(format(json.load(open('reigning-score.json'))['total'], ','))")
          printf '## Reigning score\n\n%s structural units\n' "$total" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the merged entry
        id: entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_PR: ${{ inputs.pull_request }}
        run: |
          commit_sha="$GITHUB_SHA"
          if [[ -n "$MANUAL_PR" ]]; then
            if [[ ! "$MANUAL_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo 'pull_request must be a positive integer' >&2
              exit 2
            fi
            gh api "repos/$GITHUB_REPOSITORY/pulls/$MANUAL_PR" \
              --jq '[.]' > associated-prs.json
            commit_sha=$(python3 -c \
              'import json; print(json.load(open("associated-prs.json"))[0]["merge_commit_sha"])')
          else
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > associated-prs.json
          fi
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Update the front-page leaderboard
        run: >-
          python3 bonsai/update_leaderboard.py README.md reigning-score.json bonsai/season.json
          associated-prs.json --commit-sha "${{ steps.entry.outputs.commit_sha }}"

      - name: Commit a changed leaderboard
        run: |
          if git diff --quiet -- README.md; then
            echo 'No merged competition entry is associated with this push.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: update reigning leaderboard [skip ci]'
          git push origin HEAD:main

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reigning-score-${{ github.sha }}
          path: reigning-score.json
          retention-days: 90
