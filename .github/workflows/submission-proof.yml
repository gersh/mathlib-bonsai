name: Submission proof

on:
  workflow_dispatch:

concurrency:
  group: submission-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prove:
    name: preserve everything
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Check out reigning Bonsai
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: gersh/mathlib-bonsai
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: baseline

      - name: Resolve and fetch reigning commit
        id: revisions
        env:
          BASE_REPOSITORY: gersh/mathlib-bonsai
        run: |
          base_sha=$(git -C baseline rev-parse HEAD)
          candidate_sha=$(git -C candidate rev-parse HEAD)
          git -C candidate fetch --no-tags --depth=1 \
            "https://github.com/${BASE_REPOSITORY}.git" "$base_sha"
          printf 'base=%s\ncandidate=%s\n' "$base_sha" "$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Enforce entry boundary
        run: >-
          python3 baseline/bonsai/check_policy.py candidate
          '${{ steps.revisions.outputs.base }}'
          '${{ steps.revisions.outputs.candidate }}'

      - name: Configure Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: baseline
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
          reinstall-transient-toolchain: true

      - name: Restore upstream Mathlib cache
        working-directory: baseline
        run: lake exe cache --repo=leanprover-community/mathlib4 get

      - name: Measure reigning baseline
        run: |
          python3 baseline/bonsai/scorer.py baseline --output baseline-score.json >/dev/null
          mapfile -d '' changed < <(git -C candidate diff --no-renames --name-only -z \
            '${{ steps.revisions.outputs.base }}' '${{ steps.revisions.outputs.candidate }}')
          python3 baseline/bonsai/heartbeats.py baseline "${changed[@]}" \
            --output baseline-heartbeats.json
          baseline/bonsai/export_surface.sh baseline baseline/bonsai/surface.lean baseline-surface.jsonl

      - name: Reuse cache in candidate
        run: cp -a baseline/.lake candidate/.lake

      - name: Build candidate with warnings as errors
        working-directory: candidate
        env:
          CI: "true"
        run: lake build --wfail Mathlib

      - name: Reject build-time source generation
        working-directory: candidate
        run: |
          git diff --exit-code HEAD
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Measure candidate
        run: |
          python3 baseline/bonsai/scorer.py candidate --output candidate-score.json >/dev/null
          mapfile -d '' changed < <(git -C candidate diff --no-renames --name-only -z \
            '${{ steps.revisions.outputs.base }}' '${{ steps.revisions.outputs.candidate }}')
          python3 baseline/bonsai/heartbeats.py candidate "${changed[@]}" \
            --output candidate-heartbeats.json
          baseline/bonsai/export_surface.sh candidate baseline/bonsai/surface.lean candidate-surface.jsonl

      - name: Prove score and public theorem surface
        run: |
          python3 baseline/bonsai/compare.py \
            baseline-score.json candidate-score.json \
            baseline-heartbeats.json candidate-heartbeats.json \
            baseline-surface.jsonl candidate-surface.jsonl \
            --output result.json --markdown report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload submission proof
        if: always() && hashFiles('result.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: submission-proof-${{ github.sha }}
          path: |
            result.json
            report.md
            baseline-heartbeats.json
            candidate-heartbeats.json
          if-no-files-found: error
          retention-days: 30
